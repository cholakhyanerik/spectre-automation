[package]
name = "spectre-automation"
version = "0.5.0"
edition = "2024"

# Требования записаны обычным semver ("0.39" — это ^0.39), а НЕ ">= 0.39".
# Разница не косметическая: у ">=" нет верхней границы, и `cargo update`
# вправе подтянуть по нему мажорную версию с ломающим API — без единого
# предупреждения. Для харнесса, который меряет, это опаснее, чем для обычной
# программы: ошибка сборки была бы честной, а вот молчаливый переезд sysinfo
# на следующий минор поменял бы саму методику замера (что возвращает
# process.name(), как считается cpu_usage()) — прогоны "до" и "после" стали бы
# несопоставимы без подъёма версии харнесса и без строки в CHANGELOG.md.
#
# Возможность обновляться от этого не теряется: её даёт `cargo upgrade`
# (cargo-edit), который правит эти строки явно и попадает в диф. Мажорный
# скачок берётся `cargo upgrade --incompatible` — осознанно, со сборкой,
# тестами и настоящим прогоном, как требует Правило 3.
[dependencies]
dotenvy = "0.15"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plotters = "0.3"
chrono = "0.4" # Добавлено для фиксации даты и времени запусков

enigo = "0.6"
sysinfo = "0.39"
nvml-wrapper = "0.13"

# Чтение таблицы `_migrations` из exchanges.db: на какой схеме стоит стенд.
# Стандартной библиотекой это не решается, а разбирать файл базы руками нельзя:
# база в режиме WAL, свежие записи лежат в exchanges.db-wal, и самодельный
# читатель показал бы состояние ДО последних миграций — правдоподобное и
# неверное. Открываем базу СТРОГО на чтение, причины — в instance.rs.
#
# Фича именно "bundled-windows", а НЕ "bundled", и это решение, а не опечатка.
# "bundled" собирает SQLite из исходников на ЛЮБОЙ платформе, в том числе при
# `cargo check --target aarch64-apple-darwin` — а компилятора C под macOS на
# машине разработки нет, и кросс-проверка из Правила 2 (единственное, чем здесь
# вообще проверяются #[cfg]-ветки чужих ОС) начинает падать на чужом крейте.
# "bundled-windows" собирает SQLite там, где идут замеры, и берёт системный
# libsqlite3 на macOS и Linux: на macOS он входит в систему, на Linux нужен
# пакет разработки (README, раздел требований) — и его отсутствие даёт честную
# ошибку сборки, а не молчаливо неверное число.
rusqlite = { version = "0.40.2", features = ["bundled-windows"] }
